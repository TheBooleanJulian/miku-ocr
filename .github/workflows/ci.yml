name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Import check
        env:
          TELEGRAM_BOT_TOKEN: "dummy_token_for_import_check"
          FREELLMAPI_API_KEY: "dummy_key_for_import_check"
        run: python -c "import main; print('Imports OK')"
